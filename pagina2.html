<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>INSCRIPCIONES A DEPORTES</title>
</head>
<body>
            <h1> Deportes Unca</h1>
            <h2>Formulario de Inscripción Deportiva</h2>
            <p>Por favor, complete los datos del participante para procesar su solicitud de inscripción.</p>

            <!-- Formulario HTML5 parametrizado -->
            <form action="pagina3.html" method="post">

                <!-- 1. Información de la actividad (Campos inhabilitados) -->
                <fieldset>
                    <legend>Información de la actividad seleccionada</legend>

                    <p>
                        <label for="actividad">Actividad:</label><br>
                        <input type="text" id="actividad" name="actividad" value="Vóley" disabled>
                    </p>

                    <p>
                        <label for="lugar">Lugar de realización:</label><br>
                        <input type="text" id="lugar" name="lugar" value="Cancha techada" disabled>
                    </p>

                    <p>
                        <label for="dia">Día asignado:</label><br>
                        <input type="text" id="dia" name="dia" value="Viernes" disabled>
                    </p>

                    <p>
                        <label for="horario">Horario asignado:</label><br>
                        <input type="text" id="horario" name="horario" value="17:00 a 19:00 hs" disabled>
                    </p>
                </fieldset>

                <!-- 2. Datos del participante -->
                <fieldset>
                    <legend>Datos del participante</legend>

                    <p>
                        <label for="nombre_completo">Apellido y Nombre:</label><br>
                        <input type="text" id="nombre_completo" name="nombre_completo" maxlength="100" placeholder="Escriba su apellido y nombres" required>
                    </p>

                    <p>
                        <label for="dni">DNI (8 dígitos):</label><br>
                        <input type="text" id="dni" name="dni" inputmode="numeric" pattern="[6-14]{8}" maxlength="8" placeholder="Ej: 45678901" required>
                    </p>

                    <p>
                        <label for="fecha_nacimiento">Fecha de nacimiento:</label><br>
                        <input type="date" id="fecha_nacimiento" name="fecha_nacimiento">
                    </p>

                    <p>
                        <label for="correo_electronico">Correo electrónico:</label><br>
                        <input type="email" id="correo_electronico" name="correo_electronico" placeholder="usuario@unca.edu.ar" required>
                    </p>

                    <p>
                        <label for="telefono">Teléfono:</label><br>
                        <input type="tel" id="telefono" name="telefono" placeholder="Ej: 3834123456">
                    </p>

                    <p>
                        <label>Sexo:</label><br>
                        <label>
                            <input type="radio" name="sexo" value="Femenino"> Femenino
                        </label>
                        <label>
                            <input type="radio" name="sexo" value="Masculino"> Masculino
                        </label>
                        <label>
                            <input type="radio" name="sexo" value="No binario"> No binario
                        </label>
                    </p>
                </fieldset>

                <!-- 3. Información deportiva -->
                <fieldset>
                    <legend>Información deportiva</legend>

                    <p>
                        <label for="nivel">Nivel:</label><br>
                        <select id="nivel" name="nivel">
                            <option value="Inicial">Inicial</option>
                            <option value="Intermedio">Intermedio</option>
                            <option value="Avanzado">Avanzado</option>
                        </select>
                    </p>

                    <p>
                        <label>¿Posee experiencia previa?:</label><br>
                        <label>
                            <input type="radio" name="experiencia" value="Si"> Sí
                        </label>
                        <label>
                            <input type="radio" name="experiencia" value="No"> No
                        </label>
                    </p>

                    <p>
                        <label for="observaciones">Observaciones:</label><br>
                        <textarea id="observaciones" name="observaciones" rows="4" cols="50" placeholder="Escriba aquí cualquier información médica o detalle adicional relevante..."></textarea>
                    </p>
                </fieldset>

                <!-- 4. Aceptación de condiciones (Obligatorio) -->
                <p>
                    <label>
                        <input type="checkbox" id="condiciones" name="condiciones" required>
                        Acepto las condiciones de inscripción.
                    </label>
                </p>

                <!-- 5. Botones de Control -->
                <p>
                    <input type="submit" value="Aceptar">
                    <input type="reset" value="Cancelar">
                </p>

            </form>
        </section>
    </main>

    <!-- Pie de página común -->
    <footer>
        <p>Deportes Unca – 2026</p>
    </footer>
</body>
</html>
